name: innovagro-monitoring
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  uptime_kuma_data:

