services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transboes
      POSTGRES_USER: transboes
      POSTGRES_PASSWORD: transboes
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transboes"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

