name: Test and deploy VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: transboes-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -c backend/requirements.lock -e './backend[dev]'
      - run: ruff check . && pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy selected commit over verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/transboes_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/transboes_deploy"' EXIT
          ssh -i "$HOME/.ssh/transboes_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=45 -o ServerAliveInterval=15 "$VPS_USER@$VPS_HOST" "set -eu; cd /opt/innovagro/apps/transboes; git fetch origin $DEPLOY_SHA; git show $DEPLOY_SHA:deploy/scripts/deploy.sh > /tmp/transboes-deploy-$DEPLOY_SHA.sh; bash /tmp/transboes-deploy-$DEPLOY_SHA.sh $DEPLOY_SHA"
